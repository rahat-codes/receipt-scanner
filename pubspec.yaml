name: receiptscanner
description: "Offline-first receipt scanner Flutter app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.22.0
  drift_flutter: ^0.2.2
  sqlite3_flutter_libs: ^0.5.26
  google_mlkit_text_recognition: ^0.13.1
  image_picker: ^1.1.2
  fl_chart: ^0.70.0
  intl: ^0.20.3
  shared_preferences: ^2.3.4
  flutter_dotenv: ^5.2.1
  http: ^1.2.2
  path_provider: ^2.1.5
  path: ^1.9.0
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.0
  build_runner: ^2.4.13
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - .env.example
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon_ios_1024.png"
  adaptive_icon_background: "assets/branding/icon_android_background.png"
  adaptive_icon_foreground: "assets/branding/icon_android_foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  color: "#0F1B2D"
  image: "assets/branding/logo_rounded_512.png"
  color_dark: "#0F1B2D"
  image_dark: "assets/branding/logo_rounded_512.png"
  android_12:
    color: "#0F1B2D"
    image: "assets/branding/logo_rounded_512.png"
    color_dark: "#0F1B2D"
    image_dark: "assets/branding/logo_rounded_512.png"
